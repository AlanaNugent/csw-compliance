<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Care Worker Compliance Dashboard</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#1a2744;--navy2:#2d3f6b;--teal:#0f766e;--teal-l:#ccfbf1;
  --green:#15803d;--green-l:#dcfce7;--green-d:#14532d;
  --amber:#b45309;--amber-l:#fef3c7;--amber-d:#78350f;
  --red:#dc2626;--red-l:#fee2e2;--red-d:#7f1d1d;
  --grey:#4b5563;--grey-l:#f3f4f6;--grey-d:#1f2937;
  --border:#e5e7eb;--page:#f1f5f9;--text:#111827;--muted:#6b7280;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--page);color:var(--text);min-height:100vh}

header{background:var(--navy);color:#fff;padding:1rem 2rem;display:flex;align-items:center;gap:1rem}
.logo{width:40px;height:40px;background:var(--teal);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;font-weight:700;flex-shrink:0}
header h1{font-size:1.15rem;font-weight:600;letter-spacing:-.01em}
header p{font-size:.75rem;opacity:.65;margin-top:2px}
.header-right{margin-left:auto;display:flex;align-items:center;gap:.75rem}
.admin-link{color:rgba(255,255,255,.7);font-size:.78rem;text-decoration:none;border:1px solid rgba(255,255,255,.25);padding:.35rem .85rem;border-radius:7px;transition:background .15s;display:flex;align-items:center;gap:.35rem}
.admin-link:hover{background:rgba(255,255,255,.15)}
.updated-tag{font-size:.68rem;opacity:.55;white-space:nowrap}

.main{padding:1.5rem 2rem;max-width:1700px;margin:0 auto}

/* ── NO DATA STATE ── */
.no-data-state{max-width:500px;margin:6rem auto;text-align:center}
.no-data-state .icon{font-size:3.5rem;margin-bottom:1rem}
.no-data-state h2{font-size:1.3rem;font-weight:700;color:var(--navy);margin-bottom:.5rem}
.no-data-state p{font-size:.875rem;color:var(--muted);line-height:1.6;margin-bottom:1.5rem}
.no-data-state a{display:inline-flex;align-items:center;gap:.4rem;background:var(--navy);color:#fff;text-decoration:none;padding:.7rem 1.4rem;border-radius:9px;font-size:.875rem;font-weight:600;transition:opacity .15s}
.no-data-state a:hover{opacity:.9}

/* ── SUMMARY ── */
.summary-bar{display:flex;gap:.75rem;margin-bottom:1.25rem;flex-wrap:wrap}
.stat-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:1rem 1.25rem;min-width:110px;flex:1}
.stat-num{font-size:1.75rem;font-weight:700;line-height:1}
.stat-lbl{font-size:.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:.3rem}
.stat-green .stat-num{color:var(--green)}
.stat-amber .stat-num{color:var(--amber)}
.stat-red .stat-num{color:var(--red)}

/* ── CATEGORY CARDS ── */
.cat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-bottom:1.25rem}
.cat-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:1rem 1.25rem}
.cat-title{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--navy);margin-bottom:.65rem;display:flex;align-items:center;gap:.4rem}
.cat-bar-row{display:flex;align-items:center;gap:.5rem;margin-bottom:.35rem}
.cat-bar-label{width:120px;font-size:.72rem;color:var(--muted);flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat-bar-track{flex:1;background:#f3f4f6;border-radius:99px;height:7px;overflow:hidden}
.cat-bar-fill{height:100%;border-radius:99px;transition:width .4s}
.cat-bar-right{display:flex;align-items:center;gap:.3rem;min-width:70px;justify-content:flex-end}
.cat-bar-pct{font-size:.7rem;font-weight:700;color:var(--navy);width:32px;text-align:right}
.cat-bar-ov{font-size:.65rem;color:var(--red);font-weight:600}

/* ── TOOLBAR & TABS ── */
.toolbar{display:flex;align-items:center;gap:.75rem;margin-bottom:.75rem;flex-wrap:wrap}
.tab-row{display:flex;gap:.25rem;flex-wrap:wrap}
.tab{padding:.4rem .85rem;border-radius:8px;font-size:.78rem;font-weight:500;cursor:pointer;border:1px solid var(--border);background:#fff;color:var(--muted);transition:all .15s}
.tab.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.tab:hover:not(.active){background:var(--grey-l);color:var(--navy)}
.tbtn{padding:.4rem .85rem;border-radius:8px;font-size:.78rem;font-weight:500;cursor:pointer;border:1px solid var(--border);background:#fff;color:var(--text);transition:all .15s}
.tbtn:hover{background:var(--grey-l)}
.tbtn.teal{color:var(--teal);border-color:var(--teal)}

/* ── CATEGORY OVERVIEW STRIP ── */
.cat-overview{display:none;background:#fff;border:1px solid var(--border);border-radius:12px;padding:1rem 1.25rem;margin-bottom:1rem}
.cat-overview.visible{display:block}
.cat-ov-title{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:.75rem}
.cat-ov-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:.75rem}
.cat-ov-item{border-radius:10px;padding:.7rem 1rem;display:flex;align-items:center;gap:.8rem}
.cat-ov-item.ov-o{background:var(--red-l)}
.cat-ov-item.ov-d{background:var(--amber-l)}
.cat-ov-item.ov-m{background:var(--grey-l)}
.cat-ov-item.ov-c{background:var(--green-l)}
.cat-ov-icon{font-size:1.35rem;flex-shrink:0}
.cat-ov-num{font-size:1.45rem;font-weight:700;line-height:1}
.ov-o .cat-ov-num{color:var(--red-d)} .ov-d .cat-ov-num{color:var(--amber-d)} .ov-m .cat-ov-num{color:var(--grey-d)} .ov-c .cat-ov-num{color:var(--green-d)}
.cat-ov-lbl{font-size:.68rem;color:var(--muted);margin-top:.12rem}
.sort-notice{font-size:.72rem;color:var(--teal);font-weight:500;margin-bottom:.35rem;display:none;align-items:center;gap:.3rem}

/* ── FILTERS ── */
.filter-row{display:flex;align-items:center;gap:.6rem;margin-bottom:.75rem;flex-wrap:wrap}
.filter-row input,.filter-row select{padding:.4rem .7rem;border:1px solid var(--border);border-radius:8px;font-size:.8rem;background:#fff;color:var(--text);outline:none}
.filter-row input{width:200px}
.filter-row input:focus,.filter-row select:focus{border-color:var(--teal)}
.fl{font-size:.72rem;color:var(--muted);white-space:nowrap;font-weight:500}
.ml-auto{margin-left:auto}
.legend{display:flex;gap:.85rem;align-items:center;font-size:.7rem;flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:.3rem}
.legend-dot{width:9px;height:9px;border-radius:3px}
#resultCount{font-size:.72rem;color:var(--muted);margin-bottom:.4rem}

/* ── TABLE ── */
.tbl-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--border);background:#fff;max-height:62vh;overflow-y:auto}
table{width:100%;border-collapse:collapse;font-size:.775rem}
thead tr:first-child th{background:var(--navy);color:#fff;padding:.5rem .7rem;font-weight:700;font-size:.65rem;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;position:sticky;top:0;z-index:12}
thead tr:first-child th.cat-hdr{text-align:center;background:var(--navy2);cursor:pointer}
thead tr:first-child th.cat-hdr:hover{background:#3a5080}
thead tr:nth-child(2) th{background:#f0f4f8;border-bottom:2px solid var(--border);padding:.4rem .7rem;font-size:.67rem;color:var(--navy);font-weight:600;white-space:nowrap;position:sticky;top:35px;z-index:11;cursor:pointer;user-select:none;transition:background .15s}
thead tr:nth-child(2) th:hover{background:#e2eaf4}
thead tr:nth-child(2) th.sorted{background:#dce8f5}
.sarrow{font-size:.6rem;margin-left:.2rem;opacity:.45}
thead tr:nth-child(2) th.sorted .sarrow{opacity:1;color:var(--teal)}
td{padding:.38rem .7rem;border-bottom:1px solid #f3f4f6;vertical-align:middle}
tr:hover td{background:#fafbfc}
td.name-cell{font-weight:600;white-space:nowrap;color:var(--navy);position:sticky;left:0;background:#fff;z-index:5;border-right:1px solid #e5e7eb;min-width:155px;padding-right:.9rem}
td.area-cell{white-space:nowrap;font-size:.72rem;position:sticky;left:155px;background:#fff;z-index:5;border-right:1px solid #e5e7eb;min-width:120px;padding-right:.9rem}
tr:hover td.name-cell,tr:hover td.area-cell{background:#fafbfc}
.area-badge{display:inline-block;padding:.18rem .55rem;border-radius:99px;font-size:.65rem;font-weight:700;background:#ede9fe;color:#5b21b6;white-space:nowrap}
.area-badge.office{background:#fef3c7;color:#92400e}
.pill{display:inline-flex;align-items:center;gap:.25rem;border-radius:6px;padding:.18rem .5rem;font-size:.67rem;font-weight:600;white-space:nowrap;line-height:1.4}
.pill-c{background:var(--green-l);color:var(--green-d)} .pill-d{background:var(--amber-l);color:var(--amber-d)} .pill-o{background:var(--red-l);color:var(--red-d)} .pill-m{background:var(--grey-l);color:var(--grey-d)}
.pill-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.pill-c .pill-dot{background:var(--green)} .pill-d .pill-dot{background:var(--amber)} .pill-o .pill-dot{background:var(--red)} .pill-m .pill-dot{background:#9ca3af}
.no-rows{text-align:center;padding:3rem;color:var(--muted);font-size:.875rem}

/* ── PRINT ── */
@media print {
  @page { size: A4 landscape; margin: 10mm 8mm; }

  /* Hide everything except the table */
  header, .toolbar, .filter-row, .summary-bar, .cat-row,
  .cat-overview, .sort-notice, #resultCount,
  .admin-link, .updated-tag, .tbtn { display: none !important; }

  body { background: #fff !important; font-size: 9pt; }
  .main { padding: 0 !important; max-width: 100% !important; }

  /* Remove scroll container so ALL rows print */
  .tbl-wrap {
    overflow: visible !important;
    max-height: none !important;
    height: auto !important;
    border: none !important;
    border-radius: 0 !important;
  }

  /* Print header above the table */
  .tbl-wrap::before {
    content: attr(data-print-title);
    display: block;
    font-size: 13pt;
    font-weight: 700;
    color: #1a2744;
    margin-bottom: 4mm;
    padding-bottom: 3mm;
    border-bottom: 2pt solid #1a2744;
  }

  table { width: 100% !important; font-size: 7.5pt; border-collapse: collapse; }

  /* Sticky headers become normal in print */
  thead tr:first-child th {
    background: #1a2744 !important;
    color: #fff !important;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
    position: static !important;
    padding: 3pt 4pt !important;
    font-size: 6.5pt !important;
  }
  thead tr:nth-child(2) th {
    background: #f0f4f8 !important;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
    position: static !important;
    padding: 3pt 4pt !important;
    font-size: 6.5pt !important;
    border-bottom: 1.5pt solid #1a2744 !important;
  }

  td {
    padding: 2.5pt 4pt !important;
    border-bottom: 0.5pt solid #e5e7eb !important;
    vertical-align: middle !important;
  }
  td.name-cell {
    position: static !important;
    font-size: 7.5pt !important;
    border-right: 0.5pt solid #e5e7eb !important;
    min-width: 0 !important;
    font-weight: 600;
  }
  td.area-cell {
    position: static !important;
    font-size: 7pt !important;
    border-right: 0.5pt solid #e5e7eb !important;
    min-width: 0 !important;
  }

  /* Colour pills — force colours to print */
  .pill {
    padding: 1pt 4pt !important;
    font-size: 6.5pt !important;
    border-radius: 3pt !important;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  .pill-c { background: #dcfce7 !important; color: #14532d !important; }
  .pill-d { background: #fef3c7 !important; color: #78350f !important; }
  .pill-o { background: #fee2e2 !important; color: #7f1d1d !important; }
  .pill-m { background: #f3f4f6 !important; color: #1f2937 !important; }
  .pill-dot { display: none !important; }

  .area-badge {
    background: #ede9fe !important;
    color: #5b21b6 !important;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
    font-size: 6.5pt !important;
    padding: 1pt 4pt !important;
  }

  /* Date below pill */
  td > div { font-size: 6pt !important; margin-top: 0 !important; }

  /* Alternate row shading for readability */
  tbody tr:nth-child(even) td { background: #f9fafb !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  /* Don't break a staff row across pages */
  tr { page-break-inside: avoid; }
}
</style>
</head>
<body>

<header>
  <div class="logo">C</div>
  <div>
    <h1>Care Worker Compliance Dashboard</h1>
    <p>Staff Training &amp; Compliance Overview</p>
  </div>
  <div class="header-right">
    <span class="updated-tag" id="updatedTag"></span>
    <a href="cw-admin.html" class="admin-link">⚙ Admin Upload</a>
  </div>
</header>

<div class="main" id="mainContent">
  <!-- Rendered by JS -->
</div>

<script>
const STORAGE_KEY = 'cw_compliance_v1';
const STATUS_SCORE = {overdue:0,due:1,missing:2,compliant:3};

const ITEMS = [
  {id:'practical',   label:'Practical Mandatory', category:'Training',   col:'Practical Mandatory',       src:'training', renewal:'18 months'},
  {id:'elearning',   label:'E-Learning',           category:'Training',   col:'E-Learn Mandatory Modules', src:'training', renewal:'18 months'},
  {id:'dols',        label:'DOLs',                  category:'Training',   col:'DoLS',                      src:'training', renewal:'18 months'},
  {id:'care_cert',   label:'Care Certificate',      category:'Training',   col:'Care Certificate',          src:'training', renewal:'No expiry'},
  {id:'driving',     label:'Driving Licence',       category:'Compliance', col:'Driving License',           src:'tasks',    renewal:'10 years'},
  {id:'mot',         label:'MOT',                   category:'Compliance', col:'MOT',                       src:'tasks',    renewal:'1 year'},
  {id:'insurance',   label:'Car Insurance',         category:'Compliance', col:'Car Insurance',             src:'tasks',    renewal:'1 year'},
  {id:'niscc',       label:'NISCC',                 category:'Compliance', col:'NISCC',                     src:'tasks',    renewal:'1 year'},
  {id:'supervision', label:'Supervision',           category:'Paperwork',  col:'Supervision',               src:'tasks',    renewal:'1 year'},
  {id:'yearly',      label:'Yearly Review',         category:'Paperwork',  col:'Yearly Review',             src:'tasks',    renewal:'1 year'},
  {id:'spot_check',  label:'Spot Check',            category:'Paperwork',  src:'tasks',                     renewal:'1 year',
   special:'spotcheck', cols:['Spot Check','M&H Obs Competency','Meds Obs Competency']},
];

let saved = null, areaMap = {}, allWorkers = [], allAreas = [], compMatrix = {};
let activeCategory = 'all', sortKey = 'default', sortDir = 1;

// ── BOOT ──
window.addEventListener('load', () => {
  try { saved = JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch {}

  if (!saved || !saved.lastUpdated) {
    renderNoData();
    return;
  }

  areaMap = saved.areaMap || {};
  buildWorkers();
  buildMatrix();
  // Office Staff always first, then remaining areas alphabetically
  const rawAreas = [...new Set(Object.values(areaMap).filter(Boolean))];
  allAreas = [
    ...rawAreas.filter(a => a === 'Office Staff'),
    ...rawAreas.filter(a => a !== 'Office Staff').sort()
  ];

  const tag = document.getElementById('updatedTag');
  const d = new Date(saved.lastUpdated);
  tag.textContent = 'Updated ' + d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});

  renderDashboard();
});

function renderNoData() {
  document.getElementById('mainContent').innerHTML = `
    <div class="no-data-state">
      <div class="icon">📋</div>
      <h2>No Data Uploaded Yet</h2>
      <p>Compliance data hasn't been uploaded yet. Go to the Admin Upload page, log in and upload the People Planner export files to get started.</p>
      <a href="cw-admin.html">⚙ Go to Admin Upload</a>
    </div>`;
}

const EXCLUDED_NAMES = ['to be allocated'];

function buildWorkers() {
  const keys = ['tasks_complete','tasks_overdue','tasks_due','training_passed','training_due','training_overdue'];
  const ns = new Set();
  keys.forEach(k => Object.keys(saved[k] || {}).forEach(n => ns.add(n)));
  allWorkers = Array.from(ns)
    .filter(n => !EXCLUDED_NAMES.some(ex => n.toLowerCase().includes(ex)))
    .sort();
}

// ── STATUS LOGIC ──
function getStatus(w, item) {
  if (item.special === 'spotcheck') return getSpotCheck(w);
  const src = item.src, col = item.col;
  const oKey = src==='training'?'training_overdue':'tasks_overdue';
  const dKey = src==='training'?'training_due':'tasks_due';
  const cKey = src==='training'?'training_passed':'tasks_complete';
  const od = saved[oKey]?.[w]?.[col];
  const dd = saved[dKey]?.[w]?.[col];
  const cd = saved[cKey]?.[w]?.[col];
  if (item.id==='care_cert') return {status:cd?'compliant':'missing',date:cd||null};
  if (od) return {status:'overdue',date:od};
  if (dd) return {status:'due',date:dd};
  if (cd) return {status:'compliant',date:cd};
  return {status:'missing',date:null};
}

function getSpotCheck(w) {
  const cols = ['Spot Check','M&H Obs Competency','Meds Obs Competency'];
  let anyOv=false, anyDue=false, dates=[];
  for (const col of cols) {
    if (saved.tasks_overdue?.[w]?.[col]) anyOv=true;
    if (saved.tasks_due?.[w]?.[col])     anyDue=true;
    const cd=saved.tasks_complete?.[w]?.[col];
    if (cd) dates.push(cd.substring(0,10));
  }
  if (anyOv) return {status:'overdue',date:null};
  if (dates.length===3) {
    const same=dates[0]===dates[1]&&dates[1]===dates[2];
    if (same&&!anyDue) return {status:'compliant',date:dates[0]};
    if (same&&anyDue)  return {status:'due',date:null};
    return {status:'overdue',date:null};
  }
  if (anyDue) return {status:'due',date:null};
  if (dates.length>0) return {status:'overdue',date:null};
  return {status:'missing',date:null};
}

function buildMatrix() {
  compMatrix={};
  for (const w of allWorkers) {
    compMatrix[w]={};
    for (const item of ITEMS) compMatrix[w][item.id]=getStatus(w,item);
  }
}

function fmtDate(s) {
  if (!s) return '';
  const d=new Date(s);
  return isNaN(d)?s.substring(0,10):d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
}

function pill(s) {
  const m={compliant:['pill-c','Compliant'],due:['pill-d','Due'],overdue:['pill-o','Overdue'],missing:['pill-m','Missing']};
  const [cls,lbl]=m[s]||['pill-m','?'];
  return `<span class="pill ${cls}"><span class="pill-dot"></span>${lbl}</span>`;
}

// ── RENDER DASHBOARD ──
function renderDashboard() {
  document.getElementById('mainContent').innerHTML = `
    <div class="summary-bar" id="summaryBar"></div>
    <div class="cat-row" id="catCards"></div>

    <div class="toolbar">
      <div class="tab-row" id="catTabs">
        <div class="tab active" onclick="setCategory('all',this)">All Items</div>
        <div class="tab" onclick="setCategory('Training',this)">Training</div>
        <div class="tab" onclick="setCategory('Compliance',this)">Compliance</div>
        <div class="tab" onclick="setCategory('Paperwork',this)">Paperwork</div>
      </div>
      <div style="display:flex;gap:.5rem;margin-left:auto;flex-wrap:wrap">
        <button class="tbtn teal" onclick="exportCSV()">⬇ Export CSV</button>
        <button class="tbtn" onclick="doPrint()">🖨 Print</button>
      </div>
    </div>

    <div class="filter-row">
      <span class="fl">Search:</span>
      <input type="text" id="searchInput" placeholder="Filter by name…" oninput="applyFilters()">
      <span class="fl" id="areaFilterLabel" style="${allAreas.length?'':'display:none'}">Area:</span>
      <select id="areaFilter" style="${allAreas.length?'':'display:none'}" onchange="applyFilters()">
        <option value="all">All areas</option>
        ${allAreas.map(a=>`<option value="${a}">${a}</option>`).join('')}
      </select>
      <span class="fl">Status:</span>
      <select id="statusFilter" onchange="applyFilters()">
        <option value="all">All statuses</option>
        <option value="overdue">Overdue only</option>
        <option value="due">Due only</option>
        <option value="missing">Missing only</option>
        <option value="compliant">Compliant only</option>
      </select>
      <span class="fl">Show:</span>
      <select id="workerFilter" onchange="applyFilters()">
        <option value="all">All staff</option>
        <option value="issues">Staff with any issue</option>
      </select>
      <span class="fl">Sort by:</span>
      <select id="sortByFilter" onchange="applySortBy()">
        <option value="default">Most outstanding (status)</option>
        <option value="oldest_date">Most out of date (oldest first)</option>
        <option value="name">Name (A–Z)</option>
        <option value="area">Area (A–Z)</option>
      </select>
      <div class="legend ml-auto">
        <span class="legend-item"><span class="legend-dot" style="background:var(--green)"></span>Compliant</span>
        <span class="legend-item"><span class="legend-dot" style="background:var(--amber)"></span>Due</span>
        <span class="legend-item"><span class="legend-dot" style="background:var(--red)"></span>Overdue</span>
        <span class="legend-item"><span class="legend-dot" style="background:#d1d5db"></span>Missing</span>
      </div>
    </div>

    <div class="cat-overview" id="catOverview"></div>
    <div class="sort-notice" id="sortNotice">↓ Sorted by most outstanding first — click any column header to change</div>
    <div id="resultCount"></div>

    <div class="tbl-wrap">
      <table><thead id="tableHead"></thead><tbody id="tableBody"></tbody></table>
    </div>`;

  buildTableHead();
  applyFilters();
}

// ── FILTERS ──
function visItems() {
  return activeCategory==='all'?ITEMS:ITEMS.filter(i=>i.category===activeCategory);
}

function filteredWorkers() {
  const search=(document.getElementById('searchInput')?.value||'').toLowerCase();
  const areaF=document.getElementById('areaFilter')?.value||'all';
  const statusF=document.getElementById('statusFilter')?.value||'all';
  const wF=document.getElementById('workerFilter')?.value||'all';
  const vi=visItems();
  return allWorkers.filter(w=>{
    if (search&&!w.toLowerCase().includes(search)) return false;
    if (areaF!=='all'&&(areaMap[w]||'')!==areaF) return false;
    if (wF==='issues'&&!ITEMS.some(it=>['overdue','due','missing'].includes(compMatrix[w][it.id]?.status))) return false;
    if (statusF!=='all'&&!vi.some(it=>compMatrix[w][it.id]?.status===statusF)) return false;
    return true;
  });
}

function applyFilters() {
  renderSummary();
  renderCatCards();
  renderCatOverview();
  renderTable();
}

// ── SUMMARY CARDS ──
function renderSummary() {
  const ws=filteredWorkers();
  const ovW=ws.filter(w=>ITEMS.some(it=>compMatrix[w][it.id]?.status==='overdue'));
  const duW=ws.filter(w=>!ITEMS.some(it=>compMatrix[w][it.id]?.status==='overdue')&&ITEMS.some(it=>compMatrix[w][it.id]?.status==='due'));
  let c=0,t=0;
  ws.forEach(w=>ITEMS.forEach(it=>{t++;if(compMatrix[w][it.id]?.status==='compliant')c++;}));
  document.getElementById('summaryBar').innerHTML=`
    <div class="stat-card"><div class="stat-num">${ws.length}</div><div class="stat-lbl">Staff Shown</div></div>
    <div class="stat-card stat-red"><div class="stat-num">${ovW.length}</div><div class="stat-lbl">With Overdue Items</div></div>
    <div class="stat-card stat-amber"><div class="stat-num">${duW.length}</div><div class="stat-lbl">With Items Due</div></div>
    <div class="stat-card stat-green"><div class="stat-num">${ws.length-ovW.length-duW.length}</div><div class="stat-lbl">Fully Compliant</div></div>
    <div class="stat-card stat-green"><div class="stat-num">${t?Math.round(c/t*100):0}%</div><div class="stat-lbl">Compliance Rate</div></div>`;
}

// ── CAT CARDS ──
function renderCatCards() {
  const ws=filteredWorkers();
  document.getElementById('catCards').innerHTML=['Training','Compliance','Paperwork'].map(cat=>{
    const icon=cat==='Training'?'🎓':cat==='Compliance'?'📋':'📝';
    const rows=ITEMS.filter(i=>i.category===cat).map(item=>{
      let c=0,o=0,d=0,m=0;
      ws.forEach(w=>{const s=compMatrix[w]?.[item.id]?.status;if(s==='compliant')c++;else if(s==='overdue')o++;else if(s==='due')d++;else m++;});
      const tot=ws.length||1,pct=Math.round(c/tot*100);
      const col=pct>=90?'var(--green)':pct>=70?'var(--amber)':'var(--red)';
      return `<div class="cat-bar-row">
        <span class="cat-bar-label" title="${item.label}">${item.label}</span>
        <div class="cat-bar-track"><div class="cat-bar-fill" style="width:${pct}%;background:${col}"></div></div>
        <div class="cat-bar-right"><span class="cat-bar-pct">${pct}%</span>${o>0?`<span class="cat-bar-ov">${o}⚠</span>`:''}</div>
      </div>`;
    }).join('');
    return `<div class="cat-card"><div class="cat-title">${icon} ${cat}</div>${rows}</div>`;
  }).join('');
}

// ── CATEGORY OVERVIEW STRIP ──
function renderCatOverview() {
  const strip=document.getElementById('catOverview');
  if (!strip) return;
  if (activeCategory==='all') { strip.className='cat-overview'; return; }

  const ws=filteredWorkers();
  const catItems=ITEMS.filter(i=>i.category===activeCategory);
  let wOv=0,wDue=0,wMiss=0,wOk=0;
  ws.forEach(w=>{
    const scores=catItems.map(it=>STATUS_SCORE[compMatrix[w][it.id]?.status]??3);
    const worst=Math.min(...scores);
    if(worst===0)wOv++;else if(worst===1)wDue++;else if(worst===2)wMiss++;else wOk++;
  });
  const itemDetail=catItems.map(item=>{
    let o=0,d=0,m=0;
    ws.forEach(w=>{const s=compMatrix[w]?.[item.id]?.status;if(s==='overdue')o++;else if(s==='due')d++;else if(s==='missing')m++;});
    return {label:item.label,o,d,m};
  });
  const icon=activeCategory==='Training'?'🎓':activeCategory==='Compliance'?'📋':'📝';
  strip.innerHTML=`
    <div class="cat-ov-title">${icon} ${activeCategory} — section overview (${ws.length} staff)</div>
    <div class="cat-ov-grid">
      <div class="cat-ov-item ov-o"><div class="cat-ov-icon">🔴</div><div><div class="cat-ov-num">${wOv}</div><div class="cat-ov-lbl">Staff with overdue items</div></div></div>
      <div class="cat-ov-item ov-d"><div class="cat-ov-icon">🟡</div><div><div class="cat-ov-num">${wDue}</div><div class="cat-ov-lbl">Staff with items due</div></div></div>
      <div class="cat-ov-item ov-m"><div class="cat-ov-icon">⚪</div><div><div class="cat-ov-num">${wMiss}</div><div class="cat-ov-lbl">Staff with missing items</div></div></div>
      <div class="cat-ov-item ov-c"><div class="cat-ov-icon">✅</div><div><div class="cat-ov-num">${wOk}</div><div class="cat-ov-lbl">Fully compliant</div></div></div>
    </div>
    <div style="margin-top:.85rem;border-top:1px solid var(--border);padding-top:.7rem;display:flex;gap:1.5rem;flex-wrap:wrap">
      ${itemDetail.map(it=>`<div style="font-size:.72rem;min-width:130px">
        <div style="font-weight:600;color:var(--navy);margin-bottom:.2rem">${it.label}</div>
        ${it.o>0?`<span style="color:var(--red);font-weight:600">${it.o} overdue</span> `:''}
        ${it.d>0?`<span style="color:var(--amber);font-weight:600">${it.d} due</span> `:''}
        ${it.m>0?`<span style="color:var(--grey)">${it.m} missing</span>`:''}
        ${it.o===0&&it.d===0&&it.m===0?`<span style="color:var(--green)">All compliant ✓</span>`:''}
      </div>`).join('')}
    </div>`;
  strip.className='cat-overview visible';
}

// ── TABLE ──
function buildTableHead() {
  const vi=visItems();
  const cats=[...new Set(vi.map(i=>i.category))];
  const hasArea=allAreas.length>0;

  let r1=`<tr><th colspan="${hasArea?2:1}" style="cursor:default;text-align:left">Staff${hasArea?' &amp; Area':''}</th>`;
  cats.forEach(cat=>{
    const n=vi.filter(i=>i.category===cat).length;
    r1+=`<th class="cat-hdr" colspan="${n}" onclick="sortByCat('${cat}')" title="Sort by worst status in ${cat}">${cat}</th>`;
  });
  r1+=`</tr>`;

  let r2=`<tr>${thSort('name','Staff Member')}${hasArea?thSort('area','Area'):''}`;
  vi.forEach(item=>r2+=thSort(item.id,`${item.label}<br><span style="font-weight:400;opacity:.6;font-size:.6rem">${item.renewal}</span>`));
  r2+=`</tr>`;

  document.getElementById('tableHead').innerHTML=r1+r2;
}

function thSort(key,label) {
  const on=sortKey===key;
  return `<th class="${on?'sorted':''}" onclick="toggleSort('${key}')">${label}<span class="sarrow">${on?(sortDir===1?'▼':'▲'):'⇅'}</span></th>`;
}
function applySortBy() {
  const val = document.getElementById('sortByFilter').value;
  sortKey = val;
  sortDir = 1;
  // Update sort notice text
  const notice = document.getElementById('sortNotice');
  if (val === 'oldest_date') {
    notice.style.display = 'flex';
    notice.textContent = '↓ Sorted by most out of date first (oldest expiry date at the top)';
  } else if (val === 'default') {
    notice.style.display = activeCategory !== 'all' ? 'flex' : 'none';
    notice.textContent = '↓ Sorted by most outstanding first — click any column header to change';
  } else {
    notice.style.display = 'none';
  }
  buildTableHead();
  renderTable();
}

function toggleSort(key) {
  if(sortKey===key)sortDir*=-1;else{sortKey=key;sortDir=1;}
  // Reset the sort dropdown back to default when a column header is clicked
  const sf = document.getElementById('sortByFilter');
  if (sf) sf.value = 'default';
  buildTableHead();renderTable();
}
function sortByCat(cat) { const k='cat_'+cat; if(sortKey===k)sortDir*=-1;else{sortKey=k;sortDir=1;} buildTableHead();renderTable(); }

// Returns the oldest (earliest) date string across all non-compliant visible items for a worker
// Null/missing dates sort after real dates
function oldestNonCompliantDate(w) {
  const vi = visItems();
  let oldest = null;
  for (const item of vi) {
    const {status, date} = compMatrix[w][item.id];
    if (status === 'compliant') continue;
    if (!date) continue;
    const d = new Date(date);
    if (isNaN(d)) continue;
    if (oldest === null || d < oldest) oldest = d;
  }
  return oldest; // Date object or null
}

function workerScore(w) {
  if(sortKey==='oldest_date') {
    const d = oldestNonCompliantDate(w);
    // Null (no date = missing) sorts after all dated entries
    return d ? d.getTime() : Number.MAX_SAFE_INTEGER;
  }
  if(sortKey==='default'){const vi=visItems();return Math.min(...vi.map(it=>STATUS_SCORE[compMatrix[w][it.id]?.status]??3));}
  if(sortKey==='name') return w.toLowerCase();
  if(sortKey==='area') return (areaMap[w]||'zzz').toLowerCase();
  if(sortKey.startsWith('cat_')){const cat=sortKey.slice(4);return Math.min(...ITEMS.filter(i=>i.category===cat).map(it=>STATUS_SCORE[compMatrix[w][it.id]?.status]??3));}
  return STATUS_SCORE[compMatrix[w][sortKey]?.status]??3;
}

function renderTable(printAll) {
  const vi=visItems(), hasArea=allAreas.length>0;
  let ws=filteredWorkers();
  ws.sort((a,b)=>{const sa=workerScore(a),sb=workerScore(b);if(typeof sa==='string')return sortDir*sa.localeCompare(sb);if(sa!==sb)return sortDir*(sa-sb);return a.localeCompare(b);});
  document.getElementById('resultCount').textContent=`Showing ${ws.length} of ${allWorkers.length} staff members`;
  if(!ws.length){document.getElementById('tableBody').innerHTML=`<tr><td colspan="${vi.length+(hasArea?3:2)}" class="no-rows">No staff members match the current filters.</td></tr>`;return;}

  const sortingByDate = sortKey === 'oldest_date';

  document.getElementById('tableBody').innerHTML=ws.map(w=>{
    // Find the oldest date for this worker (for highlighting)
    const oldestD = sortingByDate ? oldestNonCompliantDate(w) : null;

    const areaCell=hasArea?`<td class="area-cell">${areaMap[w]?`<span class="area-badge${areaMap[w]==='Office Staff'?' office':''}">${areaMap[w]}</span>`:'<span style="color:#d1d5db;font-size:.65rem">—</span>'}</td>`:'';
    const cells=vi.map(item=>{
      const{status,date}=compMatrix[w][item.id];
      // Highlight the cell that is the oldest date driver
      let highlight = '';
      if (sortingByDate && date && oldestD) {
        const d = new Date(date);
        if (!isNaN(d) && d.getTime() === oldestD.getTime() && status !== 'compliant') {
          highlight = 'style="background:#fff7ed;outline:2px solid #f97316;outline-offset:-2px;border-radius:4px"';
        }
      }
      return`<td ${highlight}>${pill(status)}${date?`<div style="font-size:.6rem;color:var(--muted);margin-top:1px">${fmtDate(date)}</div>`:''}</td>`;
    }).join('');
    return`<tr><td class="name-cell">${w}</td>${areaCell}${cells}</tr>`;
  }).join('');
}

function setCategory(cat,el) {
  activeCategory=cat; sortKey='default'; sortDir=1;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  const notice=document.getElementById('sortNotice');
  if(cat==='all'){notice.style.display='none';document.getElementById('catOverview').className='cat-overview';}
  else{notice.style.display='flex';}
  buildTableHead(); renderCatOverview(); applyFilters();
}

// ── PRINT ──
function doPrint() {
  // Build a title for the print header
  const areaF = document.getElementById('areaFilter')?.value || 'all';
  const statusF = document.getElementById('statusFilter')?.value || 'all';
  const catLabel = activeCategory === 'all' ? 'All Categories' : activeCategory;
  const areaLabel = areaF === 'all' ? 'All Areas' : areaF;
  const statusLabel = statusF === 'all' ? 'All Statuses' : statusF.charAt(0).toUpperCase() + statusF.slice(1);
  const ws = filteredWorkers();
  const dateStr = new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'long',year:'numeric'});
  const title = `Care Worker Compliance Report — ${catLabel} | ${areaLabel} | ${statusLabel} | ${ws.length} staff | Printed ${dateStr}`;

  // Temporarily render ALL filtered workers (not just visible ones)
  renderTable(true);
  document.querySelector('.tbl-wrap').setAttribute('data-print-title', title);

  window.print();

  // Restore normal (scrollable) view after print dialog closes
  setTimeout(() => renderTable(false), 500);
}

// ── EXPORT ──
function exportCSV() {
  const vi=visItems(),ws=filteredWorkers(),hasArea=allAreas.length>0;
  const header=['Staff Member',...(hasArea?['Area']:[]),...vi.map(i=>i.label),...vi.map(i=>i.label+' Date')];
  const rows=ws.map(w=>[w,...(hasArea?[areaMap[w]||'']:[]),...vi.map(it=>compMatrix[w][it.id]?.status||'missing'),...vi.map(it=>fmtDate(compMatrix[w][it.id]?.date||''))]);
  const csv=[header,...rows].map(r=>r.map(c=>`"${(c||'').toString().replace(/"/g,'""')}"`).join(',')).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download=`compliance_${new Date().toISOString().substring(0,10)}.csv`;
  a.click();
}
</script>
